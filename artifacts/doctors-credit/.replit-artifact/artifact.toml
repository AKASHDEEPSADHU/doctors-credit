kind = "web"
previewPath = "/"
title = "DCredit"
description = "DCREDIT's existing Next.js website with Phase 1 patient-type and test-only Initial Patient Assessment checkout. Live payment is disabled pending policy approval."
version = "1.0.0"
id = "artifacts/doctors-credit"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19359

[services.development]
run = "pnpm --dir ../../.migration-backup run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/doctors-credit", "run", "build" ]
serve = "static"
publicDir = "artifacts/doctors-credit/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19359"
BASE_PATH = "/"
